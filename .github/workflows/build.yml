name: Build Chronos FFGL
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build-win -A x64
      - run: cmake --build build-win --config Release
      - uses: actions/upload-artifact@v4
        with: { name: Plugins-Windows-x64, path: "build-win/Release/*.dll" }
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build-mac -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build-mac --config Release
      - run: cd build-mac && for p in *.bundle; do zip -r "${p%.bundle}-macOS.zip" "$p"; done
      - uses: actions/upload-artifact@v4
        with: { name: Plugins-macOS-universal, path: "build-mac/*-macOS.zip" }
  release:
    needs: [windows, macos]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist }
      - name: Publish release with direct download links
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=chronos-latest
          gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "CHRONOS + CUTUP + PUMP FFGL plugins (latest build)" --prerelease \
            --notes "Windows: download Chronos.dll, Cutup.dll and/or Pump.dll and copy them to Documents\\Resolume Arena\\Extra Effects, then restart Resolume. macOS: unzip the -macOS.zip files and copy the .bundle files to the same folder." \
            dist/Plugins-Windows-x64/*.dll dist/Plugins-macOS-universal/*.zip
